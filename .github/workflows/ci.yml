name: Verification
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
concurrency:
  group: verify-${{ github.ref }}
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      NEXT_TELEMETRY_DISABLED: '1'
      ADMIN_PASSWORD: ci-local-test-only
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: npm audit --omit=dev --audit-level=high
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: |
          npm start > /tmp/app.log 2>&1 &
          for attempt in $(seq 1 30); do
            if curl --fail --silent http://localhost:3100/api/health/live; then break; fi
            sleep 1
          done
          npm run test:browser
          TEST_ADMIN_PASSWORD=ci-local-test-only npm run test:admin-security
          npm run test:enterprise-boundary
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: application-log
          path: /tmp/app.log
